<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>華道部 会計管理</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div>
          <p class="eyebrow">華道部</p>
          <h1>会計管理</h1>
        </div>
        <div class="month-switcher" aria-label="対象月">
          <button id="prevMonth" class="icon-button" type="button" aria-label="前の月">‹</button>
          <input id="targetMonth" type="month" />
          <button id="nextMonth" class="icon-button" type="button" aria-label="次の月">›</button>
        </div>
      </header>

      <section class="summary-grid" aria-label="月次サマリー">
        <article class="metric">
          <span>請求合計</span>
          <strong id="totalCharged">¥0</strong>
        </article>
        <article class="metric">
          <span>入金合計</span>
          <strong id="totalPaid">¥0</strong>
        </article>
        <article class="metric alert">
          <span>現在滞納</span>
          <strong id="totalDue">¥0</strong>
        </article>
        <article class="metric">
          <span>稽古参加</span>
          <strong id="totalLessons">0回</strong>
        </article>
      </section>

      <section class="settings-band">
        <div class="field">
          <label for="monthlyFee">部費</label>
          <div class="money-input">
            <span>¥</span>
            <input id="monthlyFee" type="number" min="0" step="100" readonly />
          </div>
        </div>
        <div class="lesson-setting">
          <label>稽古1</label>
          <div>
            <input id="lesson1Date" type="date" />
            <div class="money-input">
              <span>¥</span>
              <input id="lesson1Fee" type="number" min="0" step="100" />
            </div>
          </div>
        </div>
        <div class="lesson-setting">
          <label>稽古2</label>
          <div>
            <input id="lesson2Date" type="date" />
            <div class="money-input">
              <span>¥</span>
              <input id="lesson2Fee" type="number" min="0" step="100" />
            </div>
          </div>
        </div>
        <form id="addMemberForm" class="add-member">
          <label for="memberName">部員を追加</label>
          <div>
            <input id="memberName" type="text" placeholder="名前" autocomplete="off" required />
            <input id="memberGrade" type="number" min="1" step="1" placeholder="学年" required />
            <button type="submit">追加</button>
          </div>
        </form>
      </section>

      <section class="toolbar" aria-label="操作">
        <button id="saveNow" type="button">保存</button>
        <span id="saveStatus" class="save-status">自動保存中</span>
        <button id="promoteGrades" type="button">学年を一括 +1</button>
        <button id="openImport" type="button">Excel貼り付け登録</button>
        <button id="settleSuggested" type="button">未収金をまとめて入金</button>
        <button id="exportCsv" type="button">CSV出力</button>
        <button id="exportExcel" type="button">Excel出力</button>
        <button id="resetDemo" type="button">まっさらに戻す</button>
      </section>

      <section class="member-list" aria-label="部員別会計">
        <div class="list-head">
          <span>部員</span>
          <span>学年</span>
          <span>状態</span>
          <span>稽古</span>
          <span>持越</span>
          <span>請求</span>
          <span>入金</span>
          <span>現在滞納</span>
          <span>備考</span>
          <span>操作</span>
        </div>
        <div id="members"></div>
      </section>

      <dialog id="paymentDialog">
        <form method="dialog" id="paymentForm" class="dialog-form">
          <div>
            <p id="paymentMember" class="dialog-kicker"></p>
            <h2>入金を記録</h2>
          </div>
          <div class="field">
            <label for="paymentAmount">金額</label>
            <div class="money-input">
              <span>¥</span>
              <input id="paymentAmount" type="number" min="0" step="100" required />
            </div>
          </div>
          <div class="segmented" role="radiogroup" aria-label="入金方法">
            <label>
              <input type="radio" name="paymentMethod" value="振込" checked />
              <span>振込</span>
            </label>
            <label>
              <input type="radio" name="paymentMethod" value="現金" />
              <span>現金</span>
            </label>
          </div>
          <menu>
            <button value="cancel" type="button" id="cancelPayment">キャンセル</button>
            <button value="confirm" type="submit">記録</button>
          </menu>
        </form>
      </dialog>

      <dialog id="arrearsDialog">
        <form method="dialog" id="arrearsForm" class="dialog-form">
          <div>
            <p id="arrearsMember" class="dialog-kicker"></p>
            <h2>先月までの滞納</h2>
          </div>
          <div class="field">
            <label for="arrearsAmount">金額</label>
            <div class="money-input">
              <span>¥</span>
              <input id="arrearsAmount" type="number" min="0" step="100" required />
            </div>
          </div>
          <menu>
            <button value="cancel" type="button" id="cancelArrears">キャンセル</button>
            <button value="confirm" type="submit">保存</button>
          </menu>
        </form>
      </dialog>

      <dialog id="notesDialog">
        <form method="dialog" id="notesForm" class="dialog-form">
          <div>
            <p id="notesMember" class="dialog-kicker"></p>
            <h2>備考</h2>
          </div>
          <div class="field">
            <label for="notesText">内容</label>
            <textarea id="notesText" rows="8"></textarea>
          </div>
          <menu>
            <button value="cancel" type="button" id="cancelNotes">キャンセル</button>
            <button value="confirm" type="submit">保存</button>
          </menu>
        </form>
      </dialog>

      <dialog id="importDialog" class="wide-dialog">
        <form method="dialog" id="importForm" class="dialog-form">
          <div>
            <p class="dialog-kicker">Excelで表をコピーして貼り付け</p>
            <h2>部員をまとめて登録</h2>
          </div>
          <div class="field">
            <label for="importText">貼り付け内容</label>
            <textarea id="importText" rows="10" placeholder="No.	学部	学年	名前	先月末	..."></textarea>
          </div>
          <p id="importPreview" class="import-preview">貼り付けると読み取り結果が出ます。</p>
          <menu>
            <button value="cancel" type="button" id="cancelImport">キャンセル</button>
            <button value="append" type="button" id="appendImport">追加登録</button>
            <button value="replace" type="submit">全員入れ替え</button>
          </menu>
        </form>
      </dialog>

      <section class="history-panel">
        <div class="history-title">
          <h2>今月の記録</h2>
          <button id="clearMonth" type="button">今月だけ消す</button>
        </div>
        <ol id="history"></ol>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
